<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CargoConnect admin operations panel.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CargoConnect Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CargoConnect Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --cargo-navy: #0b1f3a;
      --cargo-blue: #1254a6;
      --cargo-orange: #f97316;
      --cargo-bg: #f5f7fb;
      --cargo-muted: #667085;
      --cargo-border: #d8e0ea;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--cargo-bg);
    }

    #cargo-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, #ffffff 0%, #eff4fa 55%, #f5f7fb 100%);
      color: var(--cargo-navy);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #cargo-preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .preloader-card {
      width: min(420px, calc(100vw - 40px));
      padding: 32px;
      border: 1px solid var(--cargo-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 60px rgba(11, 31, 58, 0.12);
      text-align: center;
    }

    .preloader-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--cargo-navy);
      color: white;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 16px 30px rgba(18, 84, 166, 0.22);
    }

    .preloader-title {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .preloader-subtitle {
      margin: 8px 0 24px;
      color: var(--cargo-muted);
      font-size: 14px;
      font-weight: 600;
    }

    .preloader-track {
      position: relative;
      overflow: hidden;
      height: 6px;
      border-radius: 999px;
      background: #e4eaf2;
    }

    .preloader-track::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cargo-blue), var(--cargo-orange));
      animation: cargo-progress 1.15s ease-in-out infinite;
    }

    @keyframes cargo-progress {
      0% {
        left: -40%;
      }
      100% {
        left: 102%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .preloader-track::after {
        animation: none;
        left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="cargo-preloader" aria-label="Loading CargoConnect Admin">
    <div class="preloader-card">
      <div class="preloader-mark" aria-hidden="true">CC</div>
      <h1 class="preloader-title">CargoConnect Admin</h1>
      <p class="preloader-subtitle">Preparing logistics command center</p>
      <div class="preloader-track" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    function hideCargoPreloader() {
      var preloader = document.getElementById('cargo-preloader');
      if (!preloader) {
        return;
      }
      preloader.classList.add('hidden');
      window.setTimeout(function () {
        preloader.remove();
      }, 320);
    }

    window.addEventListener('flutter-first-frame', hideCargoPreloader);
    window.addEventListener('load', function () {
      window.setTimeout(hideCargoPreloader, 9000);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
